<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painted meadow: a test scene</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c8e3ef; color: #2c2a26; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #panel { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: calc(100% - 24px); padding: 8px 10px; background: rgba(250, 246, 234, 0.86); border: 1px solid rgba(60, 50, 30, 0.18); border-radius: 10px; }
      #panel.hidden { display: none; }
      #panel span { color: #6a6456; margin: 0 2px 0 6px; }
      #panel span:first-child { margin-left: 0; }
      #panel button { font: inherit; color: inherit; min-height: 30px; padding: 4px 10px; border-radius: 7px; border: 1px solid rgba(60, 50, 30, 0.22); background: rgba(255, 255, 255, 0.6); cursor: pointer; }
      #panel button:hover { background: #fff; }
      #panel button:active { transform: translateY(1px); }
      #panel button:focus-visible { outline: 2px solid #2f6fd0; outline-offset: 1px; }
      #panel button.on { background: #3f7f4a; border-color: #3f7f4a; color: #fff; }
      #stats { font-variant-numeric: tabular-nums; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: #4a5a6a; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="loading">Painting the meadow…</div>
    <div id="panel" class="hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
