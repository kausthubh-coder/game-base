<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game panels</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2c4a36; }
      /* A stand-in for the game's canvas: a meadow at dawn, drawn with gradients. */
      #scene {
        position: fixed; inset: 0;
        background:
          radial-gradient(28vw 18vh at 30% 62%, oklch(0.62 0.11 145 / 0.9), transparent 70%),
          radial-gradient(34vw 20vh at 74% 78%, oklch(0.5 0.09 150 / 0.9), transparent 70%),
          linear-gradient(180deg, oklch(0.78 0.08 230) 0%, oklch(0.88 0.07 90) 34%, oklch(0.6 0.11 142) 34.2%, oklch(0.42 0.09 150) 100%);
      }
      #ui { position: fixed; inset: 0; }
      #controls {
        position: fixed; left: 12px; top: 12px; z-index: 30; display: flex; flex-wrap: wrap; gap: 6px; max-width: 420px;
        padding: 10px; border-radius: 8px; background: oklch(0.2 0.02 250 / 0.88);
        font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; color: oklch(0.95 0.01 250);
      }
      #controls[hidden] { display: none; }
      #controls button {
        min-height: 32px; padding: 0 10px; font: inherit; color: inherit; cursor: pointer;
        border-radius: 6px; border: 1px solid oklch(0.95 0.01 250 / 0.25); background: oklch(0.95 0.01 250 / 0.08);
      }
      #controls button:hover { background: oklch(0.95 0.01 250 / 0.18); }
      #controls button:focus-visible { outline: 2px solid oklch(0.85 0.12 230); outline-offset: 2px; }
      @media (max-width: 639px) { #controls button { min-height: 44px; } }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="ui"></div>
    <div id="controls" role="toolbar" aria-label="Demo controls"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
