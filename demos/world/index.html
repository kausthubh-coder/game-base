<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World demo · game base</title>
    <style>
      :root { color-scheme: dark; --ink: #e8eaee; --dim: rgba(232, 234, 238, 0.66); --panel: rgba(16, 20, 26, 0.78); --line: rgba(255, 255, 255, 0.12); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      .panel { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
      #controls { top: 8px; right: 8px; width: 216px; display: grid; gap: 8px; }
      #controls label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; color: var(--dim); }
      #controls output { color: var(--ink); font-variant-numeric: tabular-nums; }
      #controls input[type='range'] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #f0b85a; }
      #controls .row { display: flex; gap: 6px; align-items: center; }
      button { font: inherit; color: inherit; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
      button:hover { background: rgba(255, 255, 255, 0.16); }
      button:focus-visible, input:focus-visible { outline: 2px solid #7fd4ff; outline-offset: 1px; }
      #note { color: var(--dim); min-height: 1.4em; }
      #hotbar { left: 50%; bottom: 10px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; padding: 8px; }
      #hotbar .slots { display: flex; gap: 4px; }
      #hotbar button { position: relative; width: 44px; height: 44px; padding: 0; border-radius: 5px; border: 2px solid transparent; background: rgba(0, 0, 0, 0.3); }
      #hotbar button canvas { width: 32px; height: 32px; image-rendering: pixelated; display: block; margin: 4px auto; border-radius: 2px; }
      #hotbar button span { position: absolute; left: 3px; top: 0; font-size: 10px; color: var(--ink); text-shadow: 0 1px 2px #000; }
      #hotbar button[aria-pressed='true'] { border-color: #f0b85a; background: rgba(240, 184, 90, 0.18); }
      #picked { color: var(--dim); }
      #help { left: 8px; bottom: 10px; max-width: 250px; color: var(--dim); font-size: 12px; }
      #help b { color: var(--ink); font-weight: 600; }
      #events { right: 8px; bottom: 10px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 150px; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; color: var(--dim); pointer-events: none; transition: opacity 0.4s; }
      #loading.done { opacity: 0; }
      @media (max-width: 900px) { #help, #events { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="loading">Making the land…</div>
    <div id="controls" class="panel">
      <label>Time of day <output id="timeOut">12:00</output>
        <input id="time" type="range" min="0" max="1" step="0.005" value="0.5" />
      </label>
      <label>Wet ground <output id="wetOut">0%</output>
        <input id="wet" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
      <div class="row"><button id="save" type="button">Save</button><button id="load" type="button">Load</button><button id="reset" type="button">New land</button></div>
      <div id="note"></div>
    </div>
    <div id="hotbar" class="panel"><div id="picked"></div><div class="slots" id="slots"></div></div>
    <div id="help" class="panel">
      <b>WASD</b> walk · <b>Space</b> jump and swim up · <b>Q</b> <b>E</b> turn the camera · <b>wheel</b> zoom ·
      <b>click</b> break · <b>right click</b> place · <b>1</b> to <b>0</b> pick a block
    </div>
    <div id="events" class="panel"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
