<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprites in the world, and the asset loader</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; color: #e8eaee; font: 12px/1.35 ui-sans-serif, system-ui, sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; top: 8px; right: 8px; width: 280px; max-height: calc(100% - 16px); overflow-y: auto; padding: 10px 12px; box-sizing: border-box; background: rgba(16, 20, 28, 0.86); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; }
      #panel.hidden { display: none; }
      #panel h2 { margin: 12px 0 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb0c8; }
      #panel h2:first-child { margin-top: 0; }
      #stats { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-variant-numeric: tabular-nums; }
      #stats b { font-weight: 600; text-align: right; }
      #panel label.slider { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 6px; height: 22px; }
      #panel label.slider output { text-align: right; font-variant-numeric: tabular-nums; }
      #panel input[type='range'] { width: 100%; margin: 0; }
      #panel .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      #panel button { font: inherit; color: inherit; padding: 3px 7px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.06); cursor: pointer; }
      #panel button:hover { background: rgba(255, 255, 255, 0.14); }
      #panel button:focus-visible { outline: 2px solid #8fc4ff; outline-offset: 1px; }
      #panel button.on { background: #e8c96a; border-color: #e8c96a; color: #1a1408; }
      #panel .note { color: #9fb0c8; margin: 4px 0 0; }
      #icons { display: flex; flex-wrap: wrap; gap: 2px; }
      #icons i { display: block; width: 32px; height: 32px; image-rendering: pixelated; }
      #notice { position: fixed; left: 8px; bottom: 8px; max-width: min(640px, calc(100% - 320px)); padding: 8px 10px; border-radius: 8px; background: rgba(120, 30, 90, 0.92); border: 1px solid rgba(255, 255, 255, 0.25); font-size: 13px; }
      #notice:empty { display: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; text-align: center; font-size: 13px; }
      #loading progress { width: 100%; }
      #loading.done { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="loading"><progress id="bar" max="1" value="0"></progress><div id="loading-text">Loading the manifest</div></div>
    <div id="panel">
      <h2>Counts</h2>
      <div id="stats"></div>
      <h2>World</h2>
      <label class="slider">Time of day <input id="time" type="range" min="0" max="1" step="0.005" value="0.5" /><output id="time-out"></output></label>
      <label class="slider">Characters <input id="count" type="range" min="0" max="1000" step="10" value="200" /><output id="count-out"></output></label>
      <h2>Camera</h2>
      <div class="row">
        <button id="turn-left" title="Q">Q: turn left</button>
        <button id="turn-right" title="E">E: turn right</button>
        <button id="zoom-in" title="wheel or +">Zoom in</button>
        <button id="zoom-out" title="wheel or -">Zoom out</button>
      </div>
      <h2>One hero, close</h2>
      <div class="row" id="solo">
        <button data-solo="">The crowd</button>
        <button data-solo="away">Away</button>
        <button data-solo="toward">Toward</button>
        <button data-solo="across">Across</button>
        <button data-solo="tool">Tool</button>
      </div>
      <div class="row"><button id="pause">Pause</button></div>
      <p class="note">The stone hollow is as dark as a cave. Lamps light whoever stands near them, at any hour.</p>
      <h2>Icons from the manifest</h2>
      <div id="icons"></div>
      <p class="note" id="atlas-note"></p>
    </div>
    <div id="notice"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
